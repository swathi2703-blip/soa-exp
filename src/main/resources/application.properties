spring.application.name=config-server
# Render provides PORT in production; use 8888 when running locally.
server.port=${PORT:8888}

spring.cloud.config.server.git.uri=https://github.com/swathi2703-blip/soa-exp
# The repository uses the `main` branch. This is used for requests such as
# /student-service/default.
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.clone-on-start=true
